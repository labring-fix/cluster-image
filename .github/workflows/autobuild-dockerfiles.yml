name: Auto build DOCKER image
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      version:
        required: true
        type: string
      build-args:
        required: true
        type: string

jobs:
  build_apps:
    name: Auto build app image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64,arm64 ]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Image
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          repo: labring-fix
          password: ${{ secrets.GITHUB_TOKEN }}
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
          arch: ${{ matrix.arch }}
          build_args: "${{ inputs.build-args }}"
        run: .github/scripts/dockers.sh

  build_manifest:
    needs:
      - build_apps
    name: Auto manifest app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Manifest Image
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          repo: labring-fix
          password: ${{ secrets.GITHUB_TOKEN }}
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
        run: .github/scripts/manifest-docker.sh
