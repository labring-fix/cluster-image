name: Auto build APP image
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build_apps:
    if: (inputs.app != 'sealos-patch') || (inputs.version != 'v5.0.1-beta1')
    name: Auto build app image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64,arm64 ]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download buildah and sealos
        run: .github/scripts/download.sh
      - name: Build Image
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          repo: labring-fix
          password: ${{ secrets.GITHUB_TOKEN }}
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
          arch: ${{ matrix.arch }}
        run: .github/scripts/apps.sh
  build_manifest:
    needs:
      - build_apps
    name: Auto manifest app image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download buildah and sealos
        run: .github/scripts/download.sh
      - name: Manifest Image
        env:
          registry: ghcr.io
          username: ${{ github.actor }}
          repo: labring-fix
          password: ${{ secrets.GITHUB_TOKEN }}
          app: ${{ inputs.app }}
          version: ${{ inputs.version }}
        run: .github/scripts/manifest-other.sh
